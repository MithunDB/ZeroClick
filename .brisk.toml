[package]
name = "ZeroClick"
version = "0.1.0"

[app]
bundle_id = "local.zeroclick.app"
deployment_target = "26.0"
sources = "Sources"
resources = ["Resources"]
asset_catalogs = ["Assets.xcassets"]
app_icon = "AppIcon"
frameworks = [
  "AppKit",
  "AVFoundation",
  "AVKit",
  "Combine",
  "CoreImage",
  "SwiftUI",
  "CoreMedia",
  "CoreText",
  "ImageIO",
  "PDFKit",
  "Quartz",
  "UniformTypeIdentifiers",
  "Vision",
  "ServiceManagement",
]
swift_flags = ["-swift-version", "5", "-larchive"]

[build]
architectures = ["arm64"]
platform = "macos"

[app.info]
LSUIElement = true
LSApplicationCategoryType = "public.app-category.utilities"
NSHumanReadableCopyright = "MIT License"
NSSupportsAutomaticTermination = false
NSSupportsSuddenTermination = false

[signing]
identity = "-"
hardened_runtime = false

[test]
sources = "Tests"
xctest = false

[archive]
path = ".brisk/Archives/ZeroClick.app"
export_path = ".brisk/Archives/ZeroClick.zip"
zip = true
